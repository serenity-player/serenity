name: Release

# Pushing a tag like v1.0.0 builds a signed APK and publishes a GitHub Release.
# One-time setup (keystore + repository secrets): see docs/RELEASING.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret $name. See docs/RELEASING.md."
              exit 1
            fi
          done

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build signed release APK
        env:
          SERENITY_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          SERENITY_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SERENITY_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SERENITY_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >
          ./gradlew assembleRelease
          -PversionName="${GITHUB_REF_NAME#v}"
          -PversionCode="${{ github.run_number }}"

      - name: Verify signature and write checksum
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/*.apk "dist/Serenity-${GITHUB_REF_NAME}.apk"
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$APKSIGNER" verify --print-certs "dist/Serenity-${GITHUB_REF_NAME}.apk"
          (cd dist && sha256sum "Serenity-${GITHUB_REF_NAME}.apk" > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
