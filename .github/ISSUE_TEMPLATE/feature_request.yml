name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why does it matter?
      description: What are you trying to do that's hard today?
  - type: markdown
    attributes:
      value: |
        Serenity is a remote for Spotify built on the public Web API, so it can't download or play audio itself,
        and some things (lyrics, artist top tracks, audio analysis) aren't available to new apps.
